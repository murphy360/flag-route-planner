# The project's terms: one entry each, and docs/GLOSSARY.md is generated from them (the `glossary` hook writes it,
# CI checks it). A pull request that brings in a new term defines it here.
- term: Definition of done
  definition: >
    What a pull request holds before it merges: the code, its tests, the docs it changes, and a green CI run.
  see: [Standard]
- term: Standard
  definition: >
    The shared rules every murphy360 project follows (murphy360/standards): the checks CI runs, the templates,
    and the instructions agents read.
  synonyms: [murphy360/standards]
- term: Route
  definition: >
    One tab of the source workbook ("Route N"): the stops one family handled, in the order they were listed.
  see: [Zone]
- term: Zone
  definition: >
    The planner's proposed version of a route: the stops one family installs and removes, in driving order
    from the garage and back. Zone N starts from Route N, so families keep the streets they know.
  see: [Route, Leg, Garage]
- term: Stop
  definition: >
    One address on a route or zone. It may take more than one flag.
- term: Leg
  definition: >
    A stretch of a zone, three to eight stops long, that fits in one Google Maps link. The link starts
    navigation from the phone's own location.
  see: [Zone]
- term: Garage
  definition: >
    Where the flags are kept and where every run starts and ends. Set with --garage.
- term: Override
  definition: >
    A hand fix in overrides.csv: a corrected street and town, fixed map coordinates, or both, for a stop the
    source list gets wrong. Each one shows on the Data issues list with its note.
  synonyms: [hand fix]
- term: Run
  definition: >
    One trip to install or to remove the flags of a zone for one holiday.
